<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark">
<title>Graphite Renovation — интерактивное превью</title>
<style>
:root{--bg:#0B0C0C;--s:#121414;--s2:#1A1C1C;--bd:#262929;--tx:#F2F3EE;--t2:#8A908C;--ac:#B8E600;--ink:#0E1100;--bad:#F0524F;--warn:#E8B339;--ok:#B8E600;--r:10px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.w{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(16,17,18,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
header .w{display:flex;align-items:center;gap:10px;min-height:56px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.logo{font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0}.logo i{width:18px;height:18px;border-radius:5px;background:var(--ac)}
.sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--ac);color:var(--ink);border:0;border-radius:var(--r);padding:10px 18px;font-weight:600;cursor:pointer;min-height:44px}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.g{background:none;color:var(--tx);border:1px solid var(--bd)}.btn.g:hover{background:var(--s)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}.btn.d{background:none;color:var(--bad);border:1px solid var(--bad)}
h1{font-size:clamp(32px,5vw,56px);line-height:1.05;margin:0 0 16px;letter-spacing:-1.2px}h2{font-size:24px;margin:0 0 8px;letter-spacing:-.3px}h3{font-size:17px;margin:0 0 8px}
.lead{color:var(--t2);font-size:18px;max-width:46ch;margin:0 0 22px}.mut{color:var(--t2);font-size:14px}
.card{background:var(--s);border:1px solid var(--bd);border-radius:var(--r);padding:18px;margin-bottom:12px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;padding:48px 0;align-items:start}@media(max-width:860px){.hero{grid-template-columns:1fr;padding:28px 0}}
.ph{height:130px;border-radius:var(--r);margin-top:26px;border:1px solid var(--bd);background:linear-gradient(135deg,#2a2e30 0 33%,#222527 33% 66%,#1c1e20 66%);display:flex;align-items:flex-end;padding:10px;color:var(--t2);font-size:13px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
input[type=number],input[type=text],input[type=email],input[type=password],input[type=tel],select,textarea{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:10px;min-height:42px;width:100%}
.row input[type=number]{width:84px;text-align:right}input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac)}
label.f{display:block;margin:0 0 12px;font-size:14px;color:var(--t2)}label.f>*:last-child{margin-top:4px;color:var(--tx)}
.tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--bd);padding-top:12px}.tot b{font-size:28px;font-variant-numeric:tabular-nums}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:15px}th{text-align:left;font-weight:500;color:var(--t2);padding:8px 10px;border-bottom:1px solid var(--bd)}td{padding:11px 10px;border-bottom:1px solid var(--bd)}.n{text-align:right;font-variant-numeric:tabular-nums}
tr.k{cursor:pointer}tr.k:hover{background:var(--s2)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:99px;padding:2px 10px;font-size:13px;white-space:nowrap}.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--t2))}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}@media(max-width:860px){.steps{grid-template-columns:1fr 1fr}}@media(max-width:520px){.steps{grid-template-columns:1fr}}
section.b{padding:34px 0;border-top:1px solid var(--bd)}
.auth{max-width:420px;margin:40px auto}.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.app{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 62px)}@media(max-width:860px){.app{grid-template-columns:1fr}}
aside{border-right:1px solid var(--bd);padding:14px 10px;background:#131415}@media(max-width:860px){aside{display:flex;overflow-x:auto;border:0;border-bottom:1px solid var(--bd)}}
aside button{display:flex;width:100%;gap:8px;align-items:center;background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;color:var(--t2);cursor:pointer;min-height:40px;white-space:nowrap}
aside button.on{background:var(--s2);color:var(--tx);box-shadow:inset 2px 0 0 var(--ac)}
main{padding:22px;min-width:0}.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}@media(max-width:860px){.kp{grid-template-columns:1fr 1fr}}
.kpi{background:var(--s);border:1px solid var(--bd);border-radius:var(--r);padding:12px}.kpi span{color:var(--t2);font-size:13px}.kpi b{display:block;font-size:26px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:860px){.two{grid-template-columns:1fr}}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.hist{font-size:14px;color:var(--t2);margin:0;padding-left:18px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--s2);border:1px solid var(--ac);border-radius:var(--r);padding:10px 16px;z-index:9;max-width:90vw}#toast.h{display:none}
th,.kpi span,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.chip{background:color-mix(in srgb,var(--c,#888) 14%,transparent);border-color:color-mix(in srgb,var(--c,#888) 35%,transparent)}
aside button::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--bd);flex:none}
aside button.on{background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac);box-shadow:none}aside button.on::before{background:var(--ac)}
.kpi.a{border-color:color-mix(in srgb,var(--ac) 40%,var(--bd));box-shadow:inset 0 2px 0 var(--ac)}.kpi.a b{color:var(--ac)}.kpi b{font-size:30px;letter-spacing:-.5px}
.logo i{border-radius:6px}.card,.kpi{background:linear-gradient(180deg,#141616,#101212)}
.bars{display:flex;align-items:flex-end;gap:12px;height:150px;margin:8px 0 4px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px}.bars i{width:100%;background:var(--ac);border-radius:4px 4px 0 0;min-height:3px;display:block}.bars span{font-size:11px;color:var(--t2);text-align:center;line-height:1.1;height:26px}.bars b{font-size:12px}
.ev{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--bd);font-size:14px}.ev:first-of-type{border-top:0}.ev .ic{width:30px;height:30px;border-radius:8px;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);display:grid;place-items:center;flex:none}
.btn:focus-visible{outline-color:var(--tx)}
</style></head><body>
<header><div class="w" id="hd"></div></header>
<div id="app"></div><div id="toast" class="h" role="status"></div>
<script>
const L={new:"Новая",under_review:"На рассмотрении",awaiting_approval:"Ожидает согласования",master_assigned:"Мастер назначен",in_progress:"В работе",awaiting_extra_work_approval:"Ждёт решения по доп. работам",completed:"Завершена",cancelled:"Отменена"};
const CL={new:"--ac",under_review:"--warn",awaiting_approval:"--warn",master_assigned:"--ac",in_progress:"--ok",awaiting_extra_work_approval:"--bad",completed:"--ok",cancelled:"--t2"};
const RL={client:"Клиент",master:"Мастер",manager:"Менеджер",admin:"Администратор"};
const TR={staff:{new:["under_review","cancelled"],under_review:["awaiting_approval","cancelled"],awaiting_approval:["under_review","cancelled"],master_assigned:["in_progress","cancelled"],in_progress:["completed","cancelled"],awaiting_extra_work_approval:["in_progress","cancelled"]},
master:{master_assigned:["in_progress"]},client:{new:["cancelled"]}};
const S=[["Укладка ламината","m2",780],["Поклейка обоев","m2",420],["Покраска стен","m2",350],["Монтаж плинтуса","m",190],["Замена розетки","pcs",450],["Вывоз мусора","fixed",3500]];
const UN={m2:"м²",m:"пог. м",pcs:"шт.",fixed:"услуга"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rub=n=>Number(n).toLocaleString("ru-RU",{maximumFractionDigits:2})+" ₽";
const now=()=>new Date().toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
let users=[{e:"client@demo.ru",p:"demo123",n:"Анна Клиентова",r:"client"},{e:"manager@demo.ru",p:"demo123",n:"Игорь Менеджеров",r:"manager"},{e:"master@demo.ru",p:"demo123",n:"Пётр Мастеров",r:"master",ph:"+79000000000",tg:"petr_master"},{e:"admin@demo.ru",p:"demo123",n:"Админ",r:"admin"}];
const H=(s,w)=>[{s,w,t:now()}];
let orders=[
{id:1042,c:"client@demo.ru",t:"Укладка ламината",a:"ул. Лесная, 12",st:"new",m:null,est:null,ex:[],notes:[],ph:[],h:H("new","Клиент"),calc:86400},
{id:1039,c:"client@demo.ru",t:"Покраска стен",a:"ул. Садовая, 3",st:"awaiting_approval",m:null,est:{status:"awaiting",items:[{d:"Покраска стен",q:64,p:350},{d:"Грунтовка",q:64,p:90}]},ex:[],notes:["Клиент просит краску светлее"],ph:[],h:H("awaiting_approval","Менеджер")},
{id:1036,c:"client@demo.ru",t:"Укладка плитки",a:"ул. Речная, 21",st:"awaiting_extra_work_approval",m:"master@demo.ru",est:{status:"approved",items:[{d:"Плитка",q:12,p:1100}]},ex:[{d:"Выравнивание пола",q:1,p:9800,st:"pending",r:"Перепад больше 5 мм"}],notes:[],ph:[{s:"before",w:"Пётр Мастеров",t:now()}],h:H("awaiting_extra_work_approval","Мастер")},
{id:1041,c:"ivan@mail.ru",t:"Поклейка обоев",a:"пр. Мира, 8",st:"under_review",m:null,est:null,ex:[],notes:[],ph:[],h:H("under_review","Менеджер")},
{id:1030,c:"olga@mail.ru",t:"Монтаж плинтуса",a:"ул. Южная, 5",st:"master_assigned",m:"master@demo.ru",est:null,ex:[],notes:[],ph:[],h:H("master_assigned","Менеджер")}];
let me=null,view="home",sel=null,flt="",sub="orders",calcSel={0:{on:true,q:10}},carry=null,err="";
const U=e=>users.find(u=>u.e===e),oc=o=>U(o.c)?.n||o.c;
const tot=o=>(o.est?.items||[]).reduce((s,i)=>s+Math.round(i.q*i.p*100)/100,0);
let audit=[];const log=(a)=>audit.unshift(now()+" — "+(me?me.n:"")+": "+a);
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.className="";clearTimeout(toast.k);toast.k=setTimeout(()=>t.className="h",2600)}
const chip=s=>`<span class="chip" style="--c:var(${CL[s]})">${L[s]}</span>`;
const tk=r=>r==="client"?"client":r==="master"?"master":"staff";
function go(v,id){view=v;sel=id??null;err="";render();window.scrollTo(0,0)}
function setSt(o,to,why){const r=me.r;if(!(TR[tk(r)][o.st]||[]).includes(to))return toast("Переход не разрешён для вашей роли");if(to==="cancelled"&&!why)return toast("Укажите причину отмены");
o.h.push({s:to,w:RL[r],t:now(),why});log(`заказ #${o.id}: ${L[o.st]} → ${L[to]}`);o.st=to;toast("Статус: "+L[to])}
function hdr(){const h=document.getElementById("hd");
h.innerHTML=`<button class="logo" data-a="home"><i></i>Graphite Renovation</button><div class="sp">`+(me?`<span class="mut">${esc(me.n)}</span><span class="chip">${RL[me.r]}</span><button class="btn g sm" data-a="cab">Кабинет</button><button class="btn g sm" data-a="out">Выйти</button>`:`<button class="btn g" data-a="login">Войти</button><button class="btn" data-a="reg">Регистрация</button>`)+`</div>`}
function calcHtml(){return `<div class="card"><h3>Калькулятор</h3><div class="mut">Демо-цены. В приложении берутся из базы данных.</div>`+S.map((s,i)=>{const c=calcSel[i]||{};return `<div class="row"><input type="checkbox" data-c="${i}" ${c.on?"checked":""} aria-label="${s[0]}"><span>${s[0]}<br><span class="mut">${s[2]} ₽ / ${UN[s[1]]}</span></span>${s[1]==="fixed"?'<span class="mut">1 шт.</span>':`<input type="number" min="0" step="any" data-q="${i}" value="${c.q??10}" aria-label="Количество">`}</div>`}).join("")+`<div class="tot"><span class="mut">Предварительно</span><b id="sum"></b></div><p class="mut">Расчёт предварительный: итоговая смета уточняется после осмотра объекта.</p><button class="btn" style="width:100%" data-a="tocalc" id="cgo">Перенести в заявку</button></div>`}
function calcSum(){let t=0,l=[];S.forEach((s,i)=>{const c=calcSel[i];if(!c?.on)return;const q=s[1]==="fixed"?1:parseFloat(c.q);if(!(q>0))return;t+=Math.round(q*s[2]*100)/100;l.push(`${s[0]}: ${q} ${UN[s[1]]}`)});const e=document.getElementById("sum");if(e){e.textContent=rub(t);document.getElementById("cgo").disabled=!t}return{t,l}}
function home(){return `<div class="w"><div class="hero"><div><h1>Ремонт квартир с понятной сметой</h1><p class="lead">Посчитайте стоимость по прайсу, отправьте заявку и следите за ходом работ в личном кабинете.</p><div class="acts"><button class="btn" data-a="scr" data-id="calc">Рассчитать стоимость</button><button class="btn g" data-a="neworder">Оставить заявку</button></div><div class="ph">Место для фото интерьера (демо)</div></div><div id="calc">${calcHtml()}</div></div>
<section class="b" id="price"><h2>Прайс-лист</h2><div class="sc"><table><thead><tr><th>Услуга</th><th>Единица</th><th class="n">Цена</th></tr></thead><tbody>${S.map(s=>`<tr><td>${s[0]}</td><td>${UN[s[1]]}</td><td class="n">${s[2]} ₽</td></tr>`).join("")}</tbody></table></div></section>
<section class="b"><h2>Как проходит работа</h2><div class="steps"><div class="card"><b>Заявка</b><div class="mut">Описываете задачу и прикладываете фото.</div></div><div class="card"><b>Смета</b><div class="mut">Менеджер уточняет объём и присылает смету.</div></div><div class="card"><b>Работы</b><div class="mut">Мастер выкладывает фотоотчёты.</div></div><div class="card"><b>Приёмка</b><div class="mut">Вы принимаете результат и оставляете отзыв.</div></div></div></section>
<p class="mut" style="padding:20px 0 40px">Демо-версия: данные хранятся только в памяти страницы. Юридические тексты требуют проверки юристом.</p></div>`}
function login(){return `<div class="auth card"><h2>Вход</h2><form data-f="login"><label class="f">Email<input type="email" name="e" required autocomplete="username"></label><label class="f">Пароль<input type="password" name="p" required autocomplete="current-password"></label>${err?`<p style="color:var(--bad)" role="alert">⚠ ${esc(err)}</p>`:""}<button class="btn" style="width:100%">Войти</button></form><p class="mut" style="margin-top:16px">Демо-входы (пароль demo123):</p><div class="quick">${users.slice(0,4).map(u=>`<button class="btn g sm" data-a="quick" data-id="${u.e}">${RL[u.r]}</button>`).join("")}</div><p class="mut">Нет аккаунта? <a href="#" data-a="reg" style="color:var(--ac)">Зарегистрироваться</a></p></div>`}
function reg(){return `<div class="auth card"><h2>Регистрация клиента</h2><form data-f="reg"><label class="f">Имя<input type="text" name="n" required minlength="2"></label><label class="f">Email<input type="email" name="e" required></label><label class="f">Пароль (от 6 символов)<input type="password" name="p" required minlength="6" autocomplete="new-password"></label><label class="f" style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" name="c" required style="margin-top:3px"><span>Согласен на обработку персональных данных (текст требует проверки юристом)</span></label>${err?`<p style="color:var(--bad)" role="alert">⚠ ${esc(err)}</p>`:""}<button class="btn" style="width:100%">Создать аккаунт</button></form><p class="mut">Публичная регистрация создаёт только клиента. Роли сотрудников назначает администратор.</p></div>`}
function newOrder(){return `<div class="w"><div class="auth card" style="max-width:560px"><h2>Новая заявка</h2><form data-f="order"><label class="f">Что нужно сделать<input type="text" name="t" required minlength="3" value="${esc(carry?"Ремонт по расчёту":"")}"></label><label class="f">Адрес объекта<input type="text" name="a" required></label><label class="f">Телефон<input type="tel" name="ph" required pattern="[+0-9 ()-]{7,}"></label><label class="f">Описание<textarea name="d" rows="4">${esc(carry?carry.l.join("\n")+"\nПредварительно: "+rub(carry.t):"")}</textarea></label><label class="f" style="display:flex;gap:10px"><input type="checkbox" required style="margin-top:3px"><span>Согласен на обработку персональных данных</span></label><button class="btn" style="width:100%">Отправить заявку</button></form></div></div>`}
function tbl(list,k){return list.length?`<div class="sc"><table><thead><tr><th>№</th><th>Работы</th><th>Адрес</th>${k?"<th>Клиент</th>":""}<th>Статус</th></tr></thead><tbody>${list.map(o=>`<tr class="k" data-a="open" data-id="${o.id}"><td>#${o.id}</td><td>${esc(o.t)}</td><td>${esc(o.a)}</td>${k?`<td>${esc(oc(o))}</td>`:""}<td>${chip(o.st)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="mut">Заявок пока нет.</p>`}
function detail(o){const r=me.r,k=tk(r),al=TR[k][o.st]||[],mu=U(o.m);
let h=`<button class="btn g sm" data-a="cab">← К списку</button><h2 style="margin-top:12px">#${o.id} ${esc(o.t)} ${chip(o.st)}</h2><p class="mut">${esc(o.a)}${k!=="client"?" · клиент: "+esc(oc(o)):""}</p>`;
h+=`<div class="two"><div>`;
if(al.length){h+=`<div class="card"><h3>Действия</h3>${al.includes("cancelled")?`<label class="f">Причина отмены<input type="text" id="why"></label>`:""}<div class="acts">${al.map(t=>`<button class="btn ${t==="cancelled"?"d":"g"} sm" data-a="st" data-id="${o.id}" data-t="${t}">${t==="cancelled"?"Отменить":"→ "+L[t]}</button>`).join("")}</div></div>`}
else h+=`<div class="card mut">Для статуса «${L[o.st]}» у вашей роли нет действий.</div>`;
if(k==="staff"&&["under_review","awaiting_approval"].includes(o.st)){h+=`<div class="card"><h3>Назначить мастера</h3><div class="acts"><select id="ms" style="width:auto">${users.filter(u=>u.r==="master").map(u=>`<option value="${u.e}">${esc(u.n)}</option>`).join("")}</select><button class="btn sm" data-a="assign" data-id="${o.id}">Назначить</button></div></div>`}
if(o.m&&k!=="master")h+=`<div class="card"><h3>Мастер</h3>${esc(mu?.n)}<div class="acts"><a class="btn g sm" href="tel:${esc(mu?.ph)}" style="text-decoration:none;display:inline-flex;align-items:center">Позвонить</a><a class="btn g sm" target="_blank" rel="noopener" href="https://t.me/${esc(mu?.tg)}" style="text-decoration:none;display:inline-flex;align-items:center">Telegram</a></div></div>`;
if(k==="staff"&&["under_review","awaiting_approval"].includes(o.st)){const e=o.est||{status:"draft",items:[]};h+=`<div class="card"><h3>Смета ${e.status==="draft"?"(черновик)":"("+(e.status==="awaiting"?"ждёт согласования":e.status==="approved"?"согласована":"отклонена")+")"}</h3>${estT(e)}${e.status==="draft"||e.status==="rejected"?`<form data-f="line" data-id="${o.id}"><div class="two"><label class="f">Позиция<input type="text" name="d" required></label><label class="f">Кол-во<input type="number" name="q" min="0.01" step="any" required></label><label class="f">Цена за ед.<input type="number" name="p" min="0" step="any" required></label></div><div class="acts"><button class="btn g sm">Добавить позицию</button><button type="button" class="btn sm" data-a="sendest" data-id="${o.id}" ${e.items.length?"":"disabled"}>Отправить на согласование</button></div></form>`:""}</div>`}
else if(o.est&&k==="staff")h+=`<div class="card"><h3>Смета</h3>${estT(o.est)}</div>`;
if(k==="client"&&o.est&&o.est.status!=="draft")h+=`<div class="card"><h3>Смета</h3>${estT(o.est)}${o.est.status==="awaiting"?`<div class="acts"><button class="btn sm" data-a="est" data-id="${o.id}" data-v="1">Согласовать</button><button class="btn d sm" data-a="est" data-id="${o.id}" data-v="0">Отклонить</button></div>`:`<p class="mut">Статус: ${o.est.status==="approved"?"согласована":"отклонена"}</p>`}</div>`;
if(k==="client"&&o.st==="completed")h+=o.rev?`<div class="card"><h3>Ваш отзыв</h3>${"★".repeat(o.rev.n)} ${esc(o.rev.t)}<p class="mut">${o.rev.ok?"Опубликован":"На модерации"}</p></div>`:`<div class="card"><h3>Оставить отзыв</h3><form data-f="rev" data-id="${o.id}"><label class="f">Оценка<select name="n"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label class="f">Текст<textarea name="t" rows="3" required></textarea></label><button class="btn sm">Отправить</button></form></div>`;
if(k==="staff"&&o.rev)h+=`<div class="card"><h3>Отзыв</h3>${"★".repeat(o.rev.n)} ${esc(o.rev.t)}<div class="acts">${o.rev.ok?'<span class="mut">Опубликован</span>':`<button class="btn sm" data-a="mod" data-id="${o.id}">Опубликовать</button>`}</div></div>`;
h+=`</div><div>`;
if(o.ex.length||k==="master")h+=`<div class="card"><h3>Дополнительные работы</h3>${o.ex.map((x,i)=>`<p>${esc(x.d)} — ${rub(x.p*x.q)} <span class="chip" style="--c:var(${x.st==="pending"?"--warn":x.st==="approved"?"--ok":"--bad"})">${x.st==="pending"?"ждёт клиента":x.st==="approved"?"принято":"отклонено"}</span><br><span class="mut">${esc(x.r)}</span>${k==="client"&&x.st==="pending"?`<span class="acts"><button class="btn sm" data-a="ex" data-id="${o.id}" data-i="${i}" data-v="1">Принять</button><button class="btn d sm" data-a="ex" data-id="${o.id}" data-i="${i}" data-v="0">Отклонить</button></span>`:""}</p>`).join("")}${k==="master"&&o.st==="in_progress"?`<form data-f="extra" data-id="${o.id}"><label class="f">Описание<input type="text" name="d" required></label><div class="two"><label class="f">Стоимость, ₽<input type="number" name="p" min="0" step="any" required></label><label class="f">Причина<input type="text" name="r" required></label></div><button class="btn sm">Предложить клиенту</button></form>`:""}</div>`;
if(k==="master"||o.ph.length)h+=`<div class="card"><h3>Фотоотчёт</h3>${o.ph.map(p=>`<div class="mut">📷 ${p.s==="before"?"до":p.s==="during"?"во время":"после"} · ${esc(p.w)} · ${p.t}</div>`).join("")||'<div class="mut">Фото пока нет.</div>'}${k==="master"?`<div class="acts"><select id="stg" style="width:auto"><option value="before">до</option><option value="during">во время</option><option value="after">после</option></select><button class="btn g sm" data-a="photo" data-id="${o.id}">Добавить фото (демо)</button></div>`:""}</div>`;
if(k==="staff")h+=`<div class="card"><h3>Внутренние заметки</h3>${o.notes.map(n=>`<p class="mut">• ${esc(n)}</p>`).join("")}<form data-f="note" data-id="${o.id}"><input type="text" name="t" required placeholder="Заметка (клиент не видит)"><div class="acts"><button class="btn g sm">Добавить</button></div></form></div>`;
h+=`<div class="card"><h3>История</h3><ul class="hist">${o.h.map(x=>`<li>${x.t} — ${L[x.s]} (${x.w})${x.why?": "+esc(x.why):""}</li>`).join("")}</ul></div></div></div>`;return h}
const estT=e=>e.items.length?`<div class="sc"><table><thead><tr><th>Позиция</th><th class="n">Кол-во</th><th class="n">Цена</th><th class="n">Сумма</th></tr></thead><tbody>${e.items.map(i=>`<tr><td>${esc(i.d)}</td><td class="n">${i.q}</td><td class="n">${rub(i.p)}</td><td class="n">${rub(Math.round(i.q*i.p*100)/100)}</td></tr>`).join("")}</tbody></table></div><p><b>Итого: ${rub(e.items.reduce((s,i)=>s+Math.round(i.q*i.p*100)/100,0))}</b></p>`:`<p class="mut">Позиций пока нет.</p>`;
function cab(){const r=me.r,k=tk(r);
if(sel){const o=orders.find(x=>x.id===sel);const own=k==="staff"||(k==="client"&&o.c===me.e)||(k==="master"&&o.m===me.e);return `<div class="w"><main>${own?detail(o):'<div class="card">Нет доступа к этой заявке.</div>'}</main></div>`}
if(k==="client"){const l=orders.filter(o=>o.c===me.e);return `<div class="w"><main><div class="acts" style="justify-content:space-between"><h2>Мои заявки</h2><button class="btn" data-a="neworder">Новая заявка</button></div>${l.length?tbl(l):'<div class="card">Заявок пока нет. <button class="btn sm" data-a="neworder">Создать первую</button></div>'}</main></div>`}
if(k==="master"){return `<div class="w"><main><h2>Назначенные мне заказы</h2>${tbl(orders.filter(o=>o.m===me.e))}</main></div>`}
const side=`<aside><button class="${sub==="orders"?"on":""}" data-a="sub" data-id="orders">Заявки</button><button class="${sub==="rev"?"on":""}" data-a="sub" data-id="rev">Отзывы</button>${r==="admin"?`<button class="${sub==="users"?"on":""}" data-a="sub" data-id="users">Пользователи</button><button class="${sub==="log"?"on":""}" data-a="sub" data-id="log">Журнал</button>`:""}</aside>`;let b="";
if(sub==="orders"){const l=orders.filter(o=>!flt||o.st===flt),c=s=>orders.filter(o=>o.st===s).length;b=`<h2>Заявки</h2><div class="kp"><div class="kpi a"><span>Новые</span><b>${c("new")}</b></div><div class="kpi"><span>На рассмотрении</span><b>${c("under_review")}</b></div><div class="kpi"><span>В работе</span><b>${c("in_progress")}</b></div><div class="kpi"><span>Завершено</span><b>${c("completed")}</b></div></div><div class="two" style="margin-bottom:12px"><div class="card" style="margin:0"><h3>Заявки по статусам</h3><div class="bars">${Object.keys(L).map(s=>{const n=c(s),m=Math.max(1,...Object.keys(L).map(c));return `<div><b>${n}</b><i style="height:${Math.round(n/m*100)}%;${s==="cancelled"?"background:var(--bd)":""}"></i><span>${L[s].split(" ")[0]}</span></div>`}).join("")}</div></div><div class="card" style="margin:0"><h3>Последние события</h3>${orders.flatMap(o=>o.h.map(x=>({o,x}))).slice(-5).reverse().map(({o,x})=>`<div class="ev"><span class="ic">↗</span><span style="flex:1">#${o.id} — ${L[x.s]}<br><span class="mut">${x.t} · ${esc(x.w)}</span></span></div>`).join("")}</div></div><label class="f" style="max-width:260px">Фильтр по статусу<select id="flt"><option value="">Все</option>${Object.keys(L).map(s=>`<option value="${s}" ${flt===s?"selected":""}>${L[s]}</option>`).join("")}</select></label>${tbl(l,1)}`}
if(sub==="rev"){const l=orders.filter(o=>o.rev);b=`<h2>Отзывы</h2>${l.length?l.map(o=>`<div class="card">#${o.id} ${"★".repeat(o.rev.n)} ${esc(o.rev.t)}<div class="acts">${o.rev.ok?'<span class="mut">Опубликован</span>':`<button class="btn sm" data-a="mod" data-id="${o.id}">Опубликовать</button>`}</div></div>`).join(""):'<p class="mut">Отзывов пока нет. Завершите заказ и оставьте отзыв под клиентом.</p>'}`}
if(sub==="users"&&r==="admin")b=`<h2>Пользователи</h2><div class="sc"><table><thead><tr><th>Имя</th><th>Email</th><th>Роль</th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.n)}</td><td>${esc(u.e)}</td><td><select data-role="${esc(u.e)}" style="width:auto">${Object.keys(RL).map(x=>`<option value="${x}" ${u.r===x?"selected":""}>${RL[x]}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div>`;
if(sub==="log"&&r==="admin")b=`<h2>Журнал действий</h2>${audit.length?audit.map(x=>`<p class="mut">${esc(x)}</p>`).join(""):'<p class="mut">Пока пусто.</p>'}`;
return `<div class="app">${side}<main>${b}</main></div>`}
function render(){hdr();const a=document.getElementById("app");const guard=["cab","neworder"].includes(view)&&!me;if(guard){view="login";err="Войдите, чтобы продолжить"}
a.innerHTML=view==="home"?home():view==="login"?login():view==="reg"?reg():view==="neworder"?newOrder():cab();if(view==="home")calcSum()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;if(b.tagName==="A"&&b.getAttribute("href")==="#")e.preventDefault();const a=b.dataset.a,id=b.dataset.id,o=orders.find(x=>x.id==id);
switch(a){case"home":return go("home");case"login":return go("login");case"reg":return go("reg");case"cab":sel=null;return go("cab");
case"out":me=null;toast("Вы вышли");return go("home");
case"quick":me=U(id);sub="orders";toast("Вход: "+RL[me.r]);return go("cab");
case"scr":return document.getElementById(id).scrollIntoView({behavior:"smooth"});
case"tocalc":carry=calcSum();return me&&me.r==="client"?go("neworder"):me?toast("Заявки создаёт клиент. Войдите как клиент"):(err="Зарегистрируйтесь или войдите, чтобы отправить заявку",go("login"));
case"neworder":if(me&&me.r!=="client")return toast("Заявки создаёт клиент");return go("neworder");
case"open":return go("cab",+id);case"sub":sub=id;sel=null;return render();
case"st":{const w=document.getElementById("why");return setSt(o,b.dataset.t,w&&w.value.trim()),render()}
case"assign":{const m=U(document.getElementById("ms").value);o.m=m.e;o.h.push({s:"master_assigned",w:RL[me.r],t:now()});log(`заказ #${o.id}: назначен ${m.n}`);o.st="master_assigned";toast("Мастер назначен");return render()}
case"sendest":o.est.status="awaiting";o.st==="under_review"&&setSt(o,"awaiting_approval");log(`смета заказа #${o.id} отправлена`);toast("Смета отправлена клиенту");return render();
case"est":o.est.status=b.dataset.v==="1"?"approved":"rejected";log(`смета #${o.id}: ${o.est.status}`);toast(b.dataset.v==="1"?"Смета согласована":"Смета отклонена");return render();
case"ex":{const x=o.ex[b.dataset.i];x.st=b.dataset.v==="1"?"approved":"rejected";log(`доп. работы #${o.id}: ${x.st}`);o.h.push({s:"in_progress",w:"Клиент",t:now(),why:"решение по доп. работам"});o.st="in_progress";toast("Решение сохранено");return render()}
case"photo":o.ph.push({s:document.getElementById("stg").value,w:me.n,t:now()});toast("Фото добавлено (демо)");return render();
case"mod":o.rev.ok=true;toast("Отзыв опубликован");return render()}});
document.addEventListener("change",e=>{const t=e.target;if(t.id==="flt"){flt=t.value;render()}if(t.dataset.role){const u=U(t.dataset.role);log(`роль ${u.n}: ${RL[u.r]} → ${RL[t.value]}`);u.r=t.value;toast("Роль изменена")}
if(t.dataset.c!==undefined){(calcSel[t.dataset.c]??={q:10}).on=t.checked;calcSum()}});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.q!==undefined){(calcSel[t.dataset.q]??={}).q=t.value;calcSel[t.dataset.q].on??=true;calcSum()}});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target,k=f.dataset.f,d=Object.fromEntries(new FormData(f)),o=orders.find(x=>x.id==f.dataset.id);
if(k==="login"){const u=users.find(x=>x.e===d.e.trim().toLowerCase()&&x.p===d.p);if(!u){err="Неверный email или пароль";return render()}me=u;sub="orders";toast("Добро пожаловать, "+u.n);return go("cab")}
if(k==="reg"){if(U(d.e.trim().toLowerCase())){err="Этот email уже зарегистрирован";return render()}const u={e:d.e.trim().toLowerCase(),p:d.p,n:d.n.trim(),r:"client"};users.push(u);me=u;toast("Аккаунт создан");return go("cab")}
if(k==="order"){const n={id:Math.max(...orders.map(x=>x.id))+1,c:me.e,t:d.t,a:d.a,st:"new",m:null,est:null,ex:[],notes:[],ph:[],h:H("new","Клиент"),calc:carry?.t};orders.unshift(n);carry=null;log("создана заявка #"+n.id);toast("Заявка #"+n.id+" создана");return go("cab",n.id)}
if(k==="line"){o.est??={status:"draft",items:[]};if(o.est.status==="rejected")o.est={status:"draft",items:o.est.items};o.est.items.push({d:d.d,q:+d.q,p:+d.p});return render()}
if(k==="note"){o.notes.push(d.t);return render()}
if(k==="extra"){o.ex.push({d:d.d,q:1,p:+d.p,st:"pending",r:d.r});o.h.push({s:"awaiting_extra_work_approval",w:"Мастер",t:now()});o.st="awaiting_extra_work_approval";log(`доп. работы #${o.id} предложены`);toast("Предложение отправлено клиенту");return render()}
if(k==="rev"){if(o.rev)return;o.rev={n:+d.n,t:d.t,ok:false};toast("Отзыв отправлен на модерацию");return render()}});
render();
</script></body></html>
